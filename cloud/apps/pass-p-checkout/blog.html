<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>Blog</title><link rel="stylesheet" href="/styles.css"/></head><body><nav class="nav"><div class="brand"><a href="/">Home</a></div></nav><main class="wrap"><h1>Blog</h1><div id="posts"></div></main><script>fetch('/api/posts').then(function(r){return r.json()}).then(function(d){document.getElementById('posts').innerHTML=(d.posts||[]).map(function(p){return '<article class="card" style="margin:12px 0"><h2>'+p.title+'</h2><p class="muted">'+p.body+'</p></article>';}).join('')||'<p class="muted">No posts</p>';});</script></body></html>
