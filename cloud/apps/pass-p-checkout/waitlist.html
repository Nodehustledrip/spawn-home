<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>Coming soon</title><link rel="stylesheet" href="/styles.css"/></head><body><main class="wrap" style="text-align:center;padding-top:80px"><span class="badge">Coming soon</span><h1>Join the waitlist</h1><p class="muted">Be first to know when we launch.</p><form id="wl" style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:24px"><input name="email" type="email" required placeholder="you@example.com"/><button class="btn" type="submit">Notify me</button></form><p id="msg" class="muted"></p></main><script>document.getElementById('wl').onsubmit=function(e){e.preventDefault();fetch('/api/subscribe',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:new FormData(e.target).get('email')})}).then(function(r){return r.json().catch(function(){return {ok:r.ok};})}).then(function(){document.getElementById('msg').textContent='You are on the list.';}).catch(function(){document.getElementById('msg').textContent='Could not reach /api/subscribe — Run the app first.';});};</script></body></html>
