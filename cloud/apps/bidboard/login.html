<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>Sign in · BidBoard</title><link rel="stylesheet" href="styles.css"/></head><body><main class="wrap" style="max-width:420px;padding-top:48px"><div class="card"><h1 style="margin-top:0">Sign in</h1><p class="muted">Contractors: sign in to use your Pro plan.</p><form id="loginForm"><div class="field"><label>Email</label><input name="email" type="email" required/></div><div class="field"><label>Password</label><input name="password" type="password"/></div><div class="field"><label>Name (signup)</label><input name="name"/></div><p style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" type="submit" data-act="login">Log in</button><button class="btn ghost" type="submit" data-act="signup">Sign up</button></p></form><p id="msg" class="muted"></p><p><a href="./">Back</a></p></div></main><script>var form=document.getElementById('loginForm'),act='login';form.querySelectorAll('button[data-act]').forEach(function(b){b.addEventListener('click',function(){act=b.getAttribute('data-act');});});form.addEventListener('submit',function(e){e.preventDefault();var fd=new FormData(form);var body={email:fd.get('email'),password:fd.get('password'),name:fd.get('name')};var url='/api/auth/'+(act==='signup'?'signup':act==='magic'?'magic':'login');fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).then(function(r){return r.json().then(function(j){return {ok:r.ok,j:j};});}).then(function(x){document.getElementById('msg').textContent=x.ok?('Signed in as '+x.j.user.email):(x.j.error||'Failed');if(x.ok)setTimeout(function(){var n=new URLSearchParams(location.search).get('next')||'';location.href=/^\/(?!\/)[^\s]*$/.test(n)?n:'/account.html';},600);});});</script></body></html>
