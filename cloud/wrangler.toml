# Spawn Cloud Worker. NOT DEPLOYED. Replace placeholder ids before `wrangler deploy`.
name = "spawn-cloud"
main = "src/index.js"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

routes = [
  { pattern = "*.spawnapp.org/*", zone_name = "spawnapp.org" },
]

[vars]
APEX_DOMAIN = "spawnapp.org"
ALLOW_HOST_OVERRIDE = "0"

# No R2 (needs a card). Files live in D1 tables blobs/blob_chunks; FILES can be a second free D1 database.
[[d1_databases]]
binding = "FILES"
database_name = "spawn-cloud-files"
database_id = "00000000-0000-0000-0000-000000000001"
migrations_dir = "migrations"

[[d1_databases]]
binding = "DB"
database_name = "spawn-cloud"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# Secrets (set with `wrangler secret put`): SECRETS_KEY (base64, 32 bytes) — same value as Render CLOUD_SECRETS_KEY.
